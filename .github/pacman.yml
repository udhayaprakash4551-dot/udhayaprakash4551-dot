name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"      # regenerates once a day
  workflow_dispatch:          # allows manual runs from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: udhayaprakash4551-dot
          games: "pacman"

      - name: Push Pac-Man graph to the output-games branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-games
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
