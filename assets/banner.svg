<svg width="100%" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Udhaya Prakash banner">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#121212" stroke-width="1"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="280" fill="#000000"/>
  <rect width="1000" height="280" fill="url(#grid)" opacity="0.55"/>
  <rect width="1000" height="280" fill="url(#vignette)"/>

  <text x="500" y="145" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="10" fill="#FF6A00" filter="url(#glow)">
    UDHAYA PRAKASH
    <animate attributeName="opacity" values="0.72;1;0.72" dur="3.2s" repeatCount="indefinite"/>
  </text>

  <line x1="500" y1="180" x2="500" y2="180" stroke="url(#lineGrad)" stroke-width="2">
    <animate attributeName="x1" values="500;230;500" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="500;770;500" dur="4s" repeatCount="indefinite"/>
  </line>

  <text x="500" y="218" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="4" fill="#EDEDED">
    BUILDING INTELLIGENT SYSTEMS
  </text>

  <text x="500" y="250" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="3" fill="#FF6A00" opacity="0.85">
    ── AI &amp; DATA SCIENCE  ·  FRONTEND ENGINEERING ──
  </text>
</svg>
